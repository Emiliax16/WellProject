version: '3.8' # no es la versión de docker-compose, sino la versión de la sintaxis del archivo
x-defaults-container: &container-defaults
  restart: unless-stopped
  stop_grace_period: 3s
  # Sin rotación, el log del contenedor api llegó a pesar 3 GB. Con esto cada
  # contenedor guarda como máximo 5 archivos de 20 MB.
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
services:
  api:
    build:
      context: ./API
      dockerfile: development.Dockerfile
      args:
        API_PORT: 3000
        NODE_VERSION: 21-alpine
    container_name: api
    # Producción corre con `node`, no con nodemon: si el proceso termina por un
    # error, el contenedor se detiene y Docker lo levanta de nuevo
    # (`restart: unless-stopped`). Con nodemon el contenedor seguía figurando
    # `Up` con la API caída. Se llama a `node` directo, sin `npm start`, para que
    # sea el PID 1 y no sumar el proceso de npm (unos 60 MB en una instancia de
    # menos de 1 GB). Para desarrollo con recarga automática, ver
    # `docker-compose.override.yml` en API/README.md.
    command: ["node", "src/server.js"]
    # Pone un init mínimo (tini) como PID 1 que reenvía las señales a node. Sin
    # él, un SIGTERM que llega mientras node todavía carga (antes de registrar su
    # manejador) se ignora, porque el PID 1 no tiene acción por defecto, y Docker
    # termina matándolo a los 15 s.
    init: true
    # Al reiniciar o desplegar, `server.js` espera hasta 13 s a que terminen las
    # peticiones en curso (un envío a la DGA puede tardar hasta 12 s). Con el
    # margen común de 3 s, Docker los cortaba con SIGKILL. Ojo: en
    # docker-compose 2.17, `restart` usa 10 s salvo que se le pase `-t 15`.
    stop_grace_period: 15s
    healthcheck:
      # Solo informa el estado en `docker ps`: en Compose, un contenedor
      # `unhealthy` no se reinicia solo. El reinicio lo da `node` al terminar.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    volumes:
      - ./API:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 3000:3000
    depends_on:
      - db
    <<: *container-defaults
  db:
    image: postgres:14.11-alpine3.19  # Usa la imagen más reciente de PostgreSQL
    environment:
      POSTGRES_DB: ${DB_NAME}   # Nombre de la base de datos
      POSTGRES_USER: ${DB_USERNAME}     # Usuario de la base de datos
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Contraseña del usuario
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persiste los datos entre reinicios del contenedor
    ports:
      - "5432:5432"  # Mapea el puerto 5432 del contenedor al mismo puerto en el host
    <<: *container-defaults
    # Postgres necesita más de 3 s para cerrar limpio. Con el margen común, cada
    # `stop` terminaba en SIGKILL y obligaba a una recuperación al arrancar.
    stop_grace_period: 60s
  sender:
    build:
      context: ./SENDER/wellproject
      dockerfile: Dockerfile
    container_name: sender
    env_file:
      - ./SENDER/wellproject/.env
    volumes:
      - ./SENDER/wellproject:/rails
    depends_on:
      - api
      - db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  postgres_data:   # Define el volumen para almacenar datos